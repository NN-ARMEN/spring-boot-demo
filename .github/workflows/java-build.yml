name: Java CI/CD Pipeline

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    container:
      image: maven:3.9-eclipse-temurin-21-alpine
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set execute permission for mvnw
      run: chmod +x ./mvnw
    
    - name: Build with Maven
      run: ./mvnw clean compile test package
    
    - name: List JAR files
      run: |
        echo "Собранные JAR файлы:"
        ls -la ./target/*.jar 2>/dev/null || echo "JAR файлы не найдены"
    
    - name: Upload JAR artifacts
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: java-application-jar
        path: ./target/*.jar
        retention-days: 7
